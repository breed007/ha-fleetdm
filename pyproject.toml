[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "D",   # pydocstyle
  "SIM", # flake8-simplify
  "RUF",
]
ignore = [
  "D203", # incompatible with D211
  "D213", # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Mirrors the settings Home Assistant core applies to integrations on its
# strict-typing list, minus options that only matter inside the core repo
# (its stubs directory, pydantic plugin and worker count).
[tool.mypy]
python_version = "3.14"
files = ["custom_components/fleetdm"]
strict = true
show_error_codes = true
local_partial_types = true
strict_equality = true
strict_bytes = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "explicit-override",
  "ignore-without-code",
  "redundant-self",
  "truthy-iterable",
]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]

[[tool.mypy.overrides]]
module = "homeassistant.*"
no_implicit_reexport = true
