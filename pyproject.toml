[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "D",   # pydocstyle
  "SIM", # flake8-simplify
  "RUF",
]
ignore = [
  "D203", # incompatible with D211
  "D213", # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
