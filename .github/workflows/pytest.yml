name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha-version }} / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned pytest-homeassistant-custom-component release selects the
        # Home Assistant version. Each Home Assistant release has its own
        # minimum Python: 2026.7+ requires 3.14, 2025.2 requires 3.13.
        #
        # The oldest row must match the `homeassistant` floor in hacs.json —
        # that is what verifies the compatibility claim made to users.
        include:
          - ha-version: "2026.8"
            phcc: "0.13.354"
            python-version: "3.14"
          - ha-version: "2026.7"
            phcc: "0.13.345"
            python-version: "3.14"
          - ha-version: "2025.2"
            phcc: "0.13.210"
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}" pytest-cov

      - name: Show resolved Home Assistant version
        run: pip show homeassistant | grep -E "^(Name|Version)"

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=custom_components.fleetdm \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Enforce coverage floor
        if: matrix.ha-version == '2026.8'
        run: |
          pip install coverage
          coverage report --fail-under=85

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.2
      - run: ruff check custom_components/ tests/ scripts/
      - run: ruff format --check custom_components/ tests/ scripts/
