name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        # HACS installs the version declared in manifest.json, not the tag, so a
        # mismatch silently ships the wrong version number to every user.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          MANIFEST=$(python -c "import json;print(json.load(open('custom_components/fleetdm/manifest.json'))['version'])")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Release tag ($TAG) does not match manifest.json version ($MANIFEST)."
            exit 1
          fi
          echo "Release version verified."
